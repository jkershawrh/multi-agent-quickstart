{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp-server
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.mcpServer.image }}
          ports:
            - containerPort: {{ .Values.mcpServer.port }}
          command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "{{ .Values.mcpServer.port }}"]
          env:
            - name: MCP_PORT
              value: {{ .Values.mcpServer.port | quote }}
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mcpServer.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mcpServer.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-server
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp-server
  ports:
    - port: {{ .Values.mcpServer.port }}
      targetPort: {{ .Values.mcpServer.port }}
{{- end }}
