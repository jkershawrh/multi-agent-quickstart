{{- if .Values.model.deploy }}
{{- $models := list
  (dict "tier" "simple" "name" .Values.model.simpleModel "storageUri" .Values.model.simpleStorageUri)
  (dict "tier" "complex" "name" .Values.model.complexModel "storageUri" .Values.model.complexStorageUri)
}}
{{- range $index, $model := $models }}
{{- if $index }}
---
{{- end }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ $.Release.Name }}-vllm-{{ $model.tier }}
  labels:
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: {{ $.Release.Name }}
  annotations:
    openshift.io/display-name: "vLLM {{ $model.tier }} model"
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: {{ $.Values.model.image }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ $model.name }}
        - --port=8080
      ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
      resources:
        {{- toYaml $.Values.model.resources | nindent 8 }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $.Release.Name }}-vllm-{{ $model.tier }}
  labels:
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: {{ $.Release.Name }}
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: {{ $.Release.Name }}-vllm-{{ $model.tier }}
      storageUri: {{ $model.storageUri | quote }}
      resources:
        {{- toYaml $.Values.model.resources | nindent 8 }}
{{- end }}
{{- end }}
