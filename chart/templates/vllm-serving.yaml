{{- if .Values.model.deploy }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vllm
    app.kubernetes.io/component: model-serving
  annotations:
    openshift.io/display-name: "vLLM Runtime ({{ .Values.model.name }})"
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: {{ .Values.model.image }}
      ports:
        - containerPort: 8000
          protocol: TCP
      env:
        - name: MODEL_NAME
          value: {{ .Values.model.name | quote }}
      resources:
        {{- toYaml .Values.model.resources | nindent 8 }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-vllm
    app.kubernetes.io/component: model-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Release.Name }}-vllm
      resources:
        {{- toYaml .Values.model.resources | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
