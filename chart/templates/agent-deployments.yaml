{{- range $name, $agent := .Values.agents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
    app.kubernetes.io/component: agent
    agent-type: {{ $name }}
spec:
  replicas: {{ $agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
        app.kubernetes.io/component: agent
        agent-type: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}-agent
          image: {{ $agent.image }}
          ports:
            - containerPort: {{ $agent.port }}
          command: ["uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "{{ $agent.port }}"]
          env:
            - name: AGENT_NAME
              value: {{ $agent.env.AGENT_NAME | quote }}
            - name: AGENT_SKILLS
              value: {{ $agent.env.AGENT_SKILLS | quote }}
            - name: AGENT_PORT
              value: {{ $agent.port | quote }}
            {{- if $.Values.mcpServer.enabled }}
            - name: MCP_SERVER_URL
              value: "http://{{ $.Release.Name }}-mcp-server:{{ $.Values.mcpServer.port }}"
            {{- end }}
            {{- if $.Values.auth.enabled }}
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.auth.tokenSecretName }}
                  key: token
            {{- end }}
          resources:
            {{- toYaml $agent.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $agent.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $agent.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
  ports:
    - port: {{ $agent.port }}
      targetPort: {{ $agent.port }}
{{- end }}
