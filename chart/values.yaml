---
# LLM configuration
#
# Option A (recommended): Deploy with Red Hat AI Inference Server (vLLM)
# Set model.deploy=true to create a ServingRuntime + InferenceService.
# The endpoint is auto-wired to agents and orchestrator.
#
# Option B: Bring your own model (MaaS - Model as a Service)
# Set model.endpoint to your external inference endpoint.
#
# Option C: Demo mode (no model required)
# Leave model.endpoint empty and set DEMO_MODE=true on agents.
model:
  deploy: false
  endpoint: ""
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  simpleModel: "Qwen/Qwen2.5-0.5B-Instruct"
  complexModel: "Qwen/Qwen2.5-1.5B-Instruct"
  # KServe downloads these Hugging Face repositories into /mnt/models.
  simpleStorageUri: "hf://Qwen/Qwen2.5-0.5B-Instruct"
  complexStorageUri: "hf://Qwen/Qwen2.5-1.5B-Instruct"
  image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:dd104214095322ca92fb71149ae2bea8cfff54d6d261079740f673a840ed0795
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

# Orchestrator configuration
orchestrator:
  replicas: 1
  image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
  port: 8000
  # Retry missing A2A agent registrations throughout the pod lifetime.
  discoveryInterval: 10
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

observability:
  # Optional OTLP/gRPC collector endpoint, for example http://jaeger-collector:4317
  otlpEndpoint: ""

# Agent configurations -- each runs on a dedicated Intel Xeon core
agents:
  research:
    replicas: 1
    image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
    port: 8001
    env:
      AGENT_NAME: research
      AGENT_SKILLS: investigate,summarize
    resources:
      requests:
        cpu: "1"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

  analyst:
    replicas: 1
    image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
    port: 8002
    env:
      AGENT_NAME: analyst
      AGENT_SKILLS: analyze,recommend
    resources:
      requests:
        cpu: "1"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

  executor:
    replicas: 1
    image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
    port: 8003
    env:
      AGENT_NAME: executor
      AGENT_SKILLS: execute,report
    resources:
      requests:
        cpu: "1"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

# MCP tool server -- data tools for agent workflows
mcpServer:
  enabled: true
  image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
  port: 8004
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Demonstration guardrails. This regex service is educational, not a
# replacement for TrustyAI Guardrails Orchestrator or another policy service.
guardrails:
  enabled: true
  image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
  port: 8005
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Agent authentication
auth:
  enabled: false
  tokenSecretName: agent-auth-token

# Semantic routing (llm-d-sc) -- classifies query complexity to select workflow
semanticRouter:
  # Disabled by default because the classifier image/model artifacts are
  # published independently. Enable after setting usable image references.
  enabled: false
  image: quay.io/rh-ai-quickstart/llm-d-sc:latest
  modelImage: quay.io/rh-ai-quickstart/llm-d-sc-modelcar:latest
  grpcPort: 50051
  classifier: complexity
  resources:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"
