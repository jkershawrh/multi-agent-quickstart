apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: multi-agent-quickstart
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-tool-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/component: mcp-tool-server
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp-server
          image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "8004"]
          env:
            - name: MCP_PORT
              value: "8004"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: multi-agent-quickstart
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8004
      targetPort: 8004
