apiVersion: agent.kagenti.dev/v1alpha1
kind: Agent
metadata:
  name: analyst-agent
  namespace: multi-agent-quickstart
  labels:
    app.kubernetes.io/name: analyst-agent
    kagenti.io/type: agent
    kagenti.io/agent-protocol: a2a
  annotations:
    description: Analyst agent that synthesizes findings and produces recommendations
spec:
  description: Analyze data, identify patterns, and produce actionable recommendations based on research findings
  imageSource:
    image: quay.io/rh-ai-quickstart/multi-agent-quickstart:latest
  replicas: 1
  servicePorts:
    - name: http
      port: 8002
      protocol: TCP
      targetPort: 8002
  podTemplateSpec:
    spec:
      serviceAccountName: analyst-agent
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: agent
          image: <will be replaced with imageSource.image above>
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: AGENT_NAME
              value: "analyst"
            - name: AGENT_SKILLS
              value: "analyze,recommend"
            - name: AGENT_PORT
              value: "8002"
            - name: LOG_LEVEL
              value: "INFO"
            - name: MCP_SERVER_URL
              value: "http://mcp-server.multi-agent-quickstart.svc.cluster.local:8004"
            - name: XDG_CACHE_HOME
              value: "/tmp/.cache"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
